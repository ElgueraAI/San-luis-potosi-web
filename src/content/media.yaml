# Media slot manifest. Every image or video on the site is a slot here.
# To replace a placeholder: put the optimized file in src/assets/media/<region>/
# (images) or public/media/video/<region>/ (video), set src, alt, credit and
# license, and move status to "provided" (or "approved" after review).
# A replaced file always gets a NEW filename so phones never keep stale bytes.
#
# kind: image | video | plane (a transparent layer of a layered scene)

# ---------------------------------------------------------- home hero ------
# Layered scene, top of the line: the Altiplano at first light.
# Shoot note: tripod, locked off, one frame WITH and one WITHOUT the focal ruin
# (clean plate), same lens and framing for every plane.
- id: altiplano-hero-far
  kind: plane
  region: altiplano
  role: hero
  aspect: { desktop: "16:9", mobile: "9:16" }
  focal: { x: 0.5, y: 0.62 }
  subject: { es: "Placa limpia: sierra y cielo al amanecer, sin la ruina" }
  decorative: true
  src: { desktop: null, mobile: null }
  status: placeholder
